[package]
name = "concurrent-psbt"
version.workspace = true
edition = "2024"

# Used only by code that `#[test]` from test-tracing-macros generates,
# which cargo-shear cannot see.
[package.metadata.cargo-shear]
ignored = ["tracing", "tracing-chrome", "tracing-subscriber"]

[features]
default = ["unit-tests", "prop-tests"]
unit-tests = []
prop-tests = []

[dependencies]
bitcoin = "0.32"
psbt-v2 = "0.3.0"

[dev-dependencies]
proptest = "1"
test-tracing-macros = { path = "../../test-support/tracing-macros" }
tracing = "0.1"
tracing-chrome = "0.7"
tracing-subscriber = "0.3"

[lints]
workspace = true

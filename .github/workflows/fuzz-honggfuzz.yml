name: Fuzz (honggfuzz)
# Fuzzing is randomized and time-limited, so its result is not a function of
# the commit and it cannot be a flake check. It runs on a schedule instead.
on:
  schedule:
    # Arbitrary time, to avoid GitHub's peak-load scheduling delays.
    - cron: "7 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # A crash in one target says nothing about the others.
      fail-fast: false
      matrix:
        target: [hfuzz_lattice_laws, hfuzz_scrub]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main
      - uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
        with:
          # The default, latest, would fetch a newer daemon than the action pin.
          version: v3.0.1
          # Do not upload paths that cache.nixos.org already serves.
          upstream-cache-filter: true
      # Without this, a fuzzer that lost its coverage feedback would make the
      # run below look clean.
      - name: Verify that honggfuzz finds the planted crash
        run: nix run --no-update-lock-file '.?shallow=1#fuzz-honggfuzz-verify'
      - name: Fuzz ${{ matrix.target }}
        run: nix run --no-update-lock-file '.?shallow=1#fuzz-honggfuzz' -- ${{ matrix.target }} --run_time 1800
      # honggfuzz exits cleanly whether or not it found anything.
      - name: Fail on crashes
        run: |
          if compgen -G 'fuzz/honggfuzz/hfuzz_workspace/${{ matrix.target }}/*.fuzz' >/dev/null; then
            echo "::error title=honggfuzz found crashes::see the fuzz-honggfuzz-crashes-${{ matrix.target }} artifact"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-honggfuzz-crashes-${{ matrix.target }}
          path: fuzz/honggfuzz/hfuzz_workspace/${{ matrix.target }}/*.fuzz
          if-no-files-found: ignore

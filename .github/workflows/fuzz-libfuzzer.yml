name: Fuzz (libFuzzer)
# Fuzzing is randomized and time-limited, so its result is not a function of
# the commit and it cannot be a flake check. It runs on a schedule instead.
on:
  schedule:
    # Arbitrary time, to avoid GitHub's peak-load scheduling delays.
    - cron: "41 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main
      - uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
        with:
          # The default, latest, would fetch a newer daemon than the action pin.
          version: v3.0.1
          # Do not upload paths that cache.nixos.org already serves.
          upstream-cache-filter: true
      # Without this, a fuzzer that lost its coverage instrumentation would
      # make the run below look clean.
      - name: Verify that libFuzzer finds the planted crash
        run: nix run --no-update-lock-file '.?shallow=1#fuzz-libfuzzer-verify'
      - name: Fuzz the lattice laws
        run: nix run --no-update-lock-file '.?shallow=1#fuzz-libfuzzer' -- fuzz_lattice_laws -max_total_time=1800
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-libfuzzer-artifacts
          path: fuzz/libfuzzer/artifacts
          if-no-files-found: ignore

name: Cargo
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-nextest
      - name: Run tests
        run: cargo nextest run
        env:
          NEXTEST_TRACE_DIR: ${{ runner.temp }}/test-traces
      - name: Upload test traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-traces-${{ matrix.toolchain }}
          path: ${{ runner.temp }}/test-traces/*.json
      # Warn-only: this toolchain is rolling (not pinned), which may cause
      # unrelated PRs to start failing due to nightly containing new lints.
      # Nix clippy checks in ci.yml, which pins the toolchain via a flake.lock,
      # and `just clippy` both use -D warnings
      - if: matrix.toolchain == 'nightly'
        run: cargo clippy --all-targets --all-features -- -W clippy::all

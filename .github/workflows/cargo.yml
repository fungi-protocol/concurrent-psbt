name: Cargo
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-nextest
      - run: cargo nextest run
      # Warn-only: this toolchain is rolling (not pinned), which may cause
      # unrelated PRs to start failing due to nightly containing new lints.
      # Nix clippy checks in ci.yml, which pins the toolchain via a flake.lock,
      # and `just clippy` both use -D warnings
      - if: matrix.toolchain == 'nightly'
        run: cargo clippy --all-targets --all-features -- -W clippy::all

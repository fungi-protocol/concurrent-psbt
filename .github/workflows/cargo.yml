name: Cargo
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest
      - run: cargo nextest run
      # Warn-only: this toolchain is rolling (not pinned), which may cause
      # unrelated PRs to start failing due to nightly containing new lints.
      # Nix clippy checks in ci.yml, which pins the toolchain via a flake.lock,
      # and `just clippy` both use -D warnings
      - if: matrix.toolchain == 'nightly'
        run: cargo clippy --all-targets --all-features -- -W clippy::all

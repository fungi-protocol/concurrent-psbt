name: CI
on:
  pull_request:
  merge_group:
    types: [checks_requested]
jobs:
  validate-commits:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - name: Compute initial fetch depth
        id: fetch-depth
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits || 0 }}
        run: echo "depth=$((PR_COMMITS + 2))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ steps.fetch-depth.outputs.depth }}
      - name: Fetch validation history
        run: bash .github/scripts/fetch-validation-history.sh "$BASE_SHA"
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # v14
        with:
          check-owner: "false"
          check-supported: "false"
          ignore-missing-flake-lock: "false"
          fail-mode: "true"
          send-statistics: "false"
      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main
      - name: Validate commits
        run: |
          NIX_FLAKE_SHALLOW=1 nix run '.?shallow=1#validate-commits' -- --git --forward --parallel --keep-going --print-build-logs \
            -- "$BASE_SHA..HEAD"
      - name: Link recorded nextest result
        run: |
          # The history check already realized this derivation; this only adds an out-link.
          nix build --no-update-lock-file --out-link result-nextest '.#checks.x86_64-linux.tests-nightly-dev'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-nightly-dev-x86_64-linux
          path: result-nextest/nextest-run.zip

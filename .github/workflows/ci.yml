name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Compute fetch depth
        id: fetch-depth
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "depth=$(( ${{ github.event.pull_request.commits }} + 1 ))" >> "$GITHUB_OUTPUT"
          else
            echo "depth=0" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ steps.fetch-depth.outputs.depth }}
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # v13
        with:
          check-owner: "false"
          check-supported: "false"
          ignore-missing-flake-lock: "false"
          fail-mode: "true"
          send-statistics: "false"
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main
      - name: Prepare Nix build directory
        run: sudo install -d -o root -m 0755 /nix/var/nix/ci-builds
      - name: Validate commits
        env:
          NIX_CONFIG: |
            keep-failed = true
            build-dir = /nix/var/nix/ci-builds
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # HEAD is the pull request's synthetic merge commit:
            # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
            NIX_FLAKE_SHALLOW=1 nix run '.?shallow=1#validate-commits' -- --git --forward --parallel --keep-going --print-failed-build-logs \
              -- '${{ github.event.pull_request.base.sha }}..HEAD'
          else
            NIX_FLAKE_SHALLOW=1 nix run '.?shallow=1#validate-commits' -- --git --forward --parallel --keep-going --print-failed-build-logs
          fi
      - name: Link recorded nextest result
        if: ${{ !cancelled() }}
        run: |
          # The history check already realized this derivation; this only adds an out-link.
          nix build --option build-dir /nix/var/nix/ci-builds --keep-failed --no-update-lock-file --out-link result-nextest '.#checks.x86_64-linux.tests-nightly-dev'
      - name: Recover traces from failed Nix builds
        if: ${{ !cancelled() }}
        run: |
          # --keep-failed leaves daemon-owned build directories in this dedicated location.
          sudo bash -e -c '
            for build in /nix/var/nix/ci-builds/*; do
              # Nix versions may place the build files one level deeper.
              for traces in "$build/nextest-traces" "$build/build/nextest-traces"; do
                [ -d "$traces" ] || continue
                destination="$1/$(basename "$build")"
                mkdir -p "$destination"
                cp -R "$traces" "$destination/chrome-traces"
              done
            done
            if [ -d "$1" ]; then chmod -R a+rX "$1"; fi
          ' -- "$PWD/failed-nextest"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: nextest-nightly-dev-x86_64-linux
          path: |
            result-nextest/nextest-run.zip
            result-nextest/chrome-traces/*.json
            failed-nextest/

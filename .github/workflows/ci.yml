name: CI
on:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  validate-commits:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - name: Compute initial fetch depth
        id: fetch-depth
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits || 0 }}
        run: echo "depth=$((PR_COMMITS + 2))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ steps.fetch-depth.outputs.depth }}
      - name: Fetch validation history
        run: bash .github/scripts/fetch-validation-history.sh "$BASE_SHA"
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # v14
        with:
          check-owner: "false"
          check-supported: "false"
          ignore-missing-flake-lock: "false"
          fail-mode: "true"
          send-statistics: "false"
      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main
      - uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
        with:
          # The default, latest, would fetch a newer daemon than the action pin.
          version: v3.0.1
          # Do not upload paths that cache.nixos.org already serves.
          upstream-cache-filter: true
      - name: Prepare Nix build directory
        run: sudo install -d -o root -m 0755 /nix/var/nix/ci-builds
      - name: Validate commits
        env:
          NIX_CONFIG: |
            keep-failed = true
            build-dir = /nix/var/nix/ci-builds
            # Print complete logs only for failed builds.
            log-lines = 1000000
        run: |
          NIX_FLAKE_SHALLOW=1 nix run '.?shallow=1#validate-commits' -- --git --forward --parallel --keep-going \
            -- "$BASE_SHA..HEAD"
      - name: Link recorded nextest result
        if: ${{ !cancelled() }}
        run: |
          # The history check already realized this derivation; this only adds an out-link.
          nix build --option build-dir /nix/var/nix/ci-builds --keep-failed --no-update-lock-file --out-link result-nextest '.#checks.x86_64-linux.tests-nightly-dev'
      - name: Recover traces from failed Nix builds
        if: ${{ !cancelled() }}
        run: |
          # --keep-failed leaves daemon-owned build directories in this dedicated location.
          sudo bash -e -c '
            for build in /nix/var/nix/ci-builds/*; do
              # Nix versions may place the build files one level deeper.
              for traces in "$build/nextest-traces" "$build/build/nextest-traces"; do
                [ -d "$traces" ] || continue
                destination="$1/$(basename "$build")"
                mkdir -p "$destination"
                cp -R "$traces" "$destination/chrome-traces"
              done
            done
            if [ -d "$1" ]; then chmod -R a+rX "$1"; fi
          ' -- "$PWD/failed-nextest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: nextest-nightly-dev-x86_64-linux
          path: |
            result-nextest/nextest-run.zip
            result-nextest/chrome-traces/*.json
            failed-nextest/
      # The coverage checks enforce the threshold; this publishes the numbers.
      # Forks cannot upload, so only same-repository pull requests build it.
      - name: Build the coverage report
        id: coverage
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          COMMIT_OID="${{ github.event.pull_request.head.sha }}"
          system=$(nix eval --raw --impure --expr builtins.currentSystem)
          flake=".?rev=$COMMIT_OID&shallow=1"
          if [[ $(nix eval --no-update-lock-file "$flake#checks.$system" --apply 'checks: checks ? coverage-report') == true ]]; then
            nix build --no-update-lock-file "$flake#checks.$system.coverage-report" --out-link coverage
          fi
          if [[ -f coverage/cobertura.xml ]]; then
            echo "report=coverage/cobertura.xml" >> "$GITHUB_OUTPUT"
          else
            # A head that predates the Cobertura report has none to publish;
            # not a failure, but it should not pass unnoticed either.
            echo "::warning title=No coverage report::checks.$system.coverage-report at $COMMIT_OID is missing or has no cobertura.xml; skipping the upload"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.coverage.outputs.report != ''
        with:
          name: coverage-report
          path: ${{ steps.coverage.outputs.report }}
    outputs:
      coverage-report: ${{ steps.coverage.outputs.report != '' }}
  # Only this job gets the coverage write token, so code that validate-commits
  # builds or runs, such as a dependency's build script, cannot read it. It
  # does not stop the pull request itself, which supplies this workflow and
  # can rewrite this job; but only same-repository pull requests get a
  # writable token, and their authors can already push here.
  upload-coverage:
    needs: validate-commits
    if: needs.validate-commits.outputs.coverage-report == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
      - name: Upload the coverage report
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1
        with:
          file: cobertura.xml
          language: Rust
          label: code-coverage/cargo-llvm-cov

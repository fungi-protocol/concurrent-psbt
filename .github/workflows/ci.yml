name: CI
on:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  actions: read # lets hestia detect evicted cache entries upfront
  contents: read
  code-quality: write
jobs:
  validate-commits:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - name: Compute initial fetch depth
        id: fetch-depth
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits || 0 }}
        run: echo "depth=$((PR_COMMITS + 2))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ steps.fetch-depth.outputs.depth }}
      - name: Fetch validation history
        run: bash .github/scripts/fetch-validation-history.sh "$BASE_SHA"
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # v13
        with:
          check-owner: "false"
          check-supported: "false"
          ignore-missing-flake-lock: "false"
          fail-mode: "true"
          send-statistics: "false"
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main
      - uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
        with:
          # Do not upload paths that cache.nixos.org already serves.
          upstream-cache-filter: true
      - name: Validate commits
        run: |
          NIX_FLAKE_SHALLOW=1 nix run '.?shallow=1#validate-commits' -- --git --forward --parallel --keep-going --print-build-logs \
            -- "$BASE_SHA..HEAD"
      - name: Link recorded nextest result
        run: |
          # The history check already realized this derivation; this only adds an out-link.
          nix build --no-update-lock-file --out-link result-nextest '.#checks.x86_64-linux.tests-nightly-dev'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-nightly-dev-x86_64-linux
          path: result-nextest/nextest-run.zip
      - name: Build the coverage report
        id: coverage
        run: |
          COMMIT_OID="${{ github.event.pull_request.head.sha || github.sha }}"
          system=$(nix eval --raw --impure --expr builtins.currentSystem)
          nix build --no-update-lock-file ".?rev=$COMMIT_OID&shallow=1#checks.$system.coverage" --out-link coverage
          if [[ -f coverage/cobertura.xml ]]; then
            echo "report=coverage/cobertura.xml" >> "$GITHUB_OUTPUT"
          fi
      # The coverage checks enforce the threshold; this publishes the numbers.
      # Forks cannot upload.
      - name: Upload the coverage report
        if: steps.coverage.outputs.report != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1
        with:
          file: ${{ steps.coverage.outputs.report }}
          language: Rust
          label: code-coverage/cargo-llvm-cov

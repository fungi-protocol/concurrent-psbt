name: Nextest (Darwin)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  nextest:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main
      - uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
        with:
          # The default, latest, would fetch a newer daemon than the action pin.
          version: v3.0.1
          # Do not upload paths that cache.nixos.org already serves.
          upstream-cache-filter: true
      - name: Run nextest
        run: nix build --no-update-lock-file --out-link result-nextest '.#checks.aarch64-darwin.tests-nightly-dev'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-nightly-dev-aarch64-darwin
          path: result-nextest/nextest-run.zip
